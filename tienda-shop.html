<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tienda — J&D</title>
<style>
:root{
  --bg:#0f0f13;--card:#1a1a24;--card2:#22222e;--border:#2e2e3e;
  --text:#f1f0ee;--muted:#8b8a9a;--gold:#c8a84b;--goldL:#e6c56f;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;
  --radius:10px;--shadow:0 4px 20px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
a{color:var(--gold);text-decoration:none}

/* HEADER */
.site-header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.site-logo{font-size:18px;font-weight:900;color:var(--gold);letter-spacing:.5px}
.site-logo span{color:var(--text);font-weight:400;font-size:14px;margin-left:6px;opacity:.7}
.cart-btn{display:flex;align-items:center;gap:8px;background:var(--gold);color:#000;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s}
.cart-btn:hover{opacity:.85}
.cart-count{background:#000;color:var(--gold);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:24px 16px}
.section-title{font-size:20px;font-weight:700;margin-bottom:6px}
.section-sub{color:var(--muted);font-size:13px;margin-bottom:20px}

/* FILTROS */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.filters input,.filters select{padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px}
.filters input{flex:1;min-width:200px}

/* GRID PRODUCTOS */
.prods-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;cursor:pointer}
.prod-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.prod-img{width:100%;height:160px;object-fit:cover}
.prod-img-ph{width:100%;height:160px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:48px}
.prod-body{padding:14px;flex:1;display:flex;flex-direction:column;gap:5px}
.prod-name{font-size:14px;font-weight:700;line-height:1.3}
.prod-cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.prod-price{font-size:18px;font-weight:800;color:var(--gold);margin-top:4px}
.prod-stock{font-size:11px;color:var(--muted)}
.prod-actions{margin-top:10px}
.btn-add{width:100%;padding:9px;background:var(--gold);color:#000;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn-add:hover{opacity:.85}
.btn-add:disabled{opacity:.4;cursor:not-allowed}
.badge-agotado{background:#ef444422;color:#ef4444;border:1px solid #ef444444;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;display:inline-block;margin-top:6px}

/* MODAL DETALLE */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-hdr h2{font-size:16px;font-weight:700}
.mclose{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px}
.mclose:hover{color:var(--text)}
.modal-body{padding:20px}
.det-img{width:100%;max-height:280px;object-fit:cover;border-radius:8px;margin-bottom:16px}
.det-price{font-size:24px;font-weight:900;color:var(--gold);margin:10px 0}
.det-desc{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.qty-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qty-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-val{font-size:18px;font-weight:700;width:40px;text-align:center}
.btn-primary{background:var(--gold);color:#000;border:none;border-radius:8px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold)}

/* CARRITO */
.cart-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:0}
.cart-item{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.cart-item:last-child{border-bottom:none}
.cart-item-name{font-size:13px;font-weight:600;flex:1}
.cart-item-qty{display:flex;align-items:center;gap:8px}
.cart-item-qbtn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cart-total-row{padding:16px 18px;border-top:2px solid var(--gold);display:flex;justify-content:space-between;align-items:center}
.cart-total-lbl{font-size:14px;font-weight:600}
.cart-total-val{font-size:22px;font-weight:900;color:var(--gold)}
.empty-cart{text-align:center;padding:40px;color:var(--muted)}
.empty-cart .ei{font-size:42px;margin-bottom:10px}

/* CHECKOUT FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .fg{display:flex;flex-direction:column;gap:5px}
.form-grid .fg.s2{grid-column:span 2}
.form-grid label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.form-grid input,.form-grid textarea{padding:10px 13px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px}
.form-grid textarea{resize:vertical}

/* VIEWS */
.view{display:none}
.view.active{display:block}

/* SUCCESS */
.success-box{text-align:center;padding:50px 20px}
.success-icon{font-size:64px;margin-bottom:16px}
.success-title{font-size:22px;font-weight:800;margin-bottom:8px;color:var(--green)}
.success-sub{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:24px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;font-weight:600;z-index:999;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:all .25s}
.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:500px){
  .form-grid{grid-template-columns:1fr}
  .form-grid .fg.s2{grid-column:1}
  .prods-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="site-logo">J&D <span>Sex Shop</span></div>
  <button class="cart-btn" onclick="showView('cart')">
    🛒 Carrito <span class="cart-count" id="cart-count">0</span>
  </button>
</header>

<div class="main">

  <!-- VISTA: CATÁLOGO -->
  <div class="view active" id="view-catalog">
    <div class="section-title">Nuestros Productos</div>
    <div class="section-sub">Selecciona lo que deseas y agrégalo al carrito</div>
    <div class="filters">
      <input type="text" id="cat-search" placeholder="🔎 Buscar producto..." oninput="renderCatalog()">
      <select id="cat-filter-cat" onchange="renderCatalog()">
        <option value="">Todas las categorías</option>
      </select>
    </div>
    <div class="prods-grid" id="prods-grid"></div>
  </div>

  <!-- VISTA: CARRITO -->
  <div class="view" id="view-cart">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <button class="btn-secondary" onclick="showView('catalog')">← Seguir comprando</button>
      <div class="section-title" style="margin:0">Mi Carrito</div>
    </div>
    <div id="cart-body"></div>
    <div id="cart-action" style="margin-top:18px;display:flex;justify-content:flex-end">
      <button class="btn-primary" onclick="showView('checkout')" id="btn-checkout">Continuar con el pedido →</button>
    </div>
  </div>

  <!-- VISTA: CHECKOUT -->
  <div class="view" id="view-checkout">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <button class="btn-secondary" onclick="showView('cart')">← Volver al carrito</button>
      <div class="section-title" style="margin:0">Datos del Pedido</div>
    </div>
    <div class="modal-box" style="max-width:600px">
      <div class="modal-body">
        <div class="form-grid">
          <div class="fg s2"><label>Nombre completo *</label><input type="text" id="co-nombre" placeholder="Tu nombre"></div>
          <div class="fg"><label>Teléfono / WhatsApp *</label><input type="tel" id="co-tel" placeholder="Ej: 300 123 4567"></div>
          <div class="fg"><label>Email</label><input type="email" id="co-email" placeholder="correo@ejemplo.com"></div>
          <div class="fg s2"><label>Dirección de entrega *</label><input type="text" id="co-dir" placeholder="Calle, número, barrio, ciudad..."></div>
          <div class="fg s2"><label>Nota para el pedido</label><textarea id="co-nota" rows="2" placeholder="¿Alguna instrucción especial?"></textarea></div>
        </div>
        <div style="margin-top:18px;background:var(--card2);border-radius:8px;padding:14px">
          <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--muted)">RESUMEN</div>
          <div id="co-resumen"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
            <span style="font-weight:700">TOTAL</span>
            <span id="co-total" style="font-size:20px;font-weight:900;color:var(--gold)"></span>
          </div>
        </div>
        <button class="btn-primary" style="width:100%;margin-top:16px;padding:14px" onclick="confirmarPedido()">✅ Confirmar Pedido</button>
      </div>
    </div>
  </div>

  <!-- VISTA: ÉXITO -->
  <div class="view" id="view-success">
    <div class="success-box">
      <div class="success-icon">🎉</div>
      <div class="success-title">¡Pedido Confirmado!</div>
      <div class="success-sub">Tu pedido fue registrado exitosamente.<br>Nos pondremos en contacto contigo pronto para coordinar la entrega.</div>
      <div id="success-id" style="font-size:12px;color:var(--muted);margin-bottom:24px"></div>
      <button class="btn-primary" onclick="showView('catalog');_cart=[];saveCart();renderCartCount()">Seguir comprando</button>
    </div>
  </div>

</div>

<!-- MODAL DETALLE PRODUCTO -->
<div class="overlay" id="modal-prod">
  <div class="modal-box">
    <div class="modal-hdr">
      <h2 id="det-nombre">—</h2>
      <button class="mclose" onclick="closeProdModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="det-img-wrap"></div>
      <div id="det-cat" style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px"></div>
      <div class="det-price" id="det-price">—</div>
      <div class="det-desc" id="det-desc">—</div>
      <div id="det-stock-info" style="font-size:12px;color:var(--muted);margin-bottom:14px"></div>
      <div class="qty-row">
        <span style="font-size:13px;font-weight:600">Cantidad:</span>
        <button class="qty-btn" onclick="adjQty(-1)">−</button>
        <span class="qty-val" id="det-qty">1</span>
        <button class="qty-btn" onclick="adjQty(1)">+</button>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn-primary" id="det-add-btn" onclick="addToCart()">🛒 Agregar al carrito</button>
        <button class="btn-secondary" onclick="closeProdModal()">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Storage keys (shared with gerencia-general.html) ──
var _PRODS_KEY   = 'jd_tienda_prods';
var _PEDIDOS_KEY = 'jd_tienda_pedidos';
var _CART_KEY    = 'jd_tienda_cart';

function getProds(){ try{ return JSON.parse(localStorage.getItem(_PRODS_KEY)||'[]'); }catch(e){ return []; } }
function getPedidos(){ try{ return JSON.parse(localStorage.getItem(_PEDIDOS_KEY)||'[]'); }catch(e){ return []; } }
function savePedidos(d){ try{ localStorage.setItem(_PEDIDOS_KEY, JSON.stringify(d)); }catch(e){} }
function saveCart(){ try{ localStorage.setItem(_CART_KEY, JSON.stringify(_cart)); }catch(e){} }
function loadCart(){ try{ _cart=JSON.parse(localStorage.getItem(_CART_KEY)||'[]'); }catch(e){ _cart=[]; } }

// ── Carrito ──
var _cart = [];
loadCart();

function renderCartCount(){
  var n=_cart.reduce(function(s,i){return s+i.qty;},0);
  var el=document.getElementById('cart-count');
  if(el) el.textContent=n;
}
renderCartCount();

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function fmtCOP(n){ return '$'+Number(n||0).toLocaleString('es-CO'); }

// ── Toast ──
function toast(msg,type){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.style.borderColor=type==='error'?'#ef4444':type==='success'?'#22c55e':'#c8a84b';
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); },2800);
}

// ── Views ──
function showView(which){
  ['catalog','cart','checkout','success'].forEach(function(v){
    var el=document.getElementById('view-'+v);
    if(el){ el.classList.toggle('active', v===which); }
  });
  if(which==='cart') renderCart();
  if(which==='checkout') renderCheckout();
  window.scrollTo(0,0);
}

// ── Catálogo ──
function renderCatalog(){
  var prods=getProds().filter(function(p){ return p.disponible!==false; });
  var q=(document.getElementById('cat-search')?.value||'').toLowerCase();
  var cat=document.getElementById('cat-filter-cat')?.value||'';
  if(q) prods=prods.filter(function(p){ return (p.nombre||'').toLowerCase().includes(q)||(p.descripcion||'').toLowerCase().includes(q); });
  if(cat) prods=prods.filter(function(p){ return (p.categoria||'')=== cat; });
  // Actualizar selector de categorías
  var catSel=document.getElementById('cat-filter-cat');
  if(catSel){
    var cats=[...new Set(getProds().filter(function(p){return p.disponible!==false&&p.categoria;}).map(function(p){return p.categoria;}))].sort();
    var curCat=catSel.value;
    catSel.innerHTML='<option value="">Todas las categorías</option>'+cats.map(function(c){ return '<option value="'+c+'"'+(c===curCat?' selected':'')+'>'+c+'</option>'; }).join('');
  }
  var grid=document.getElementById('prods-grid');
  if(!grid) return;
  if(!prods.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)"><div style="font-size:48px">🛍️</div><p style="margin-top:10px">No hay productos disponibles aún.</p></div>';
    return;
  }
  grid.innerHTML=prods.map(function(p){
    var sinStock=p.stock!=null&&p.stock<=0;
    var imgHtml=p.imagen
      ? '<img class="prod-img" src="'+p.imagen+'" alt="'+escHtml(p.nombre||'')+'" loading="lazy">'
      : '<div class="prod-img-ph">🛍️</div>';
    return '<div class="prod-card" onclick="openProd(\''+p.id+'\')">'+
      imgHtml+
      '<div class="prod-body">'+
        '<div class="prod-cat">'+escHtml(p.categoria||'')+'</div>'+
        '<div class="prod-name">'+escHtml(p.nombre||'')+'</div>'+
        '<div class="prod-price">'+fmtCOP(p.precio||0)+'</div>'+
        '<div class="prod-stock">'+(p.stock!=null?'Stock: '+p.stock:'')+'</div>'+
        '<div class="prod-actions">'+
          (sinStock
            ? '<span class="badge-agotado">AGOTADO</span>'
            : '<button class="btn-add" onclick="event.stopPropagation();addToCartDirect(\''+p.id+'\')">🛒 Agregar</button>')+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}
renderCatalog();

// ── Modal producto ──
var _curProd=null;
var _curQty=1;
function openProd(id){
  var prods=getProds();
  _curProd=prods.find(function(p){return p.id===id;}); if(!_curProd) return;
  _curQty=1;
  document.getElementById('det-nombre').textContent=_curProd.nombre||'';
  document.getElementById('det-cat').textContent=_curProd.categoria||'';
  document.getElementById('det-price').textContent=fmtCOP(_curProd.precio||0);
  document.getElementById('det-desc').textContent=_curProd.descripcion||'Sin descripción.';
  document.getElementById('det-qty').textContent=_curQty;
  var stockInfo='';
  if(_curProd.stock!=null) stockInfo=_curProd.stock<=0?'⚠️ Agotado':'Disponibles: '+_curProd.stock;
  document.getElementById('det-stock-info').textContent=stockInfo;
  var imgWrap=document.getElementById('det-img-wrap');
  imgWrap.innerHTML=_curProd.imagen
    ? '<img class="det-img" src="'+_curProd.imagen+'" alt="'+escHtml(_curProd.nombre||'')+'">'
    : '<div class="det-img" style="display:flex;align-items:center;justify-content:center;font-size:64px;background:var(--card2)">🛍️</div>';
  var addBtn=document.getElementById('det-add-btn');
  var sinStock=_curProd.stock!=null&&_curProd.stock<=0;
  addBtn.disabled=sinStock;
  addBtn.textContent=sinStock?'Agotado':'🛒 Agregar al carrito';
  document.getElementById('modal-prod').classList.add('open');
}
function closeProdModal(){ document.getElementById('modal-prod').classList.remove('open'); _curProd=null; }
document.getElementById('modal-prod').addEventListener('click',function(e){ if(e.target===this) closeProdModal(); });

function adjQty(d){
  _curQty=Math.max(1, _curQty+d);
  if(_curProd&&_curProd.stock!=null) _curQty=Math.min(_curQty, _curProd.stock||1);
  document.getElementById('det-qty').textContent=_curQty;
}
function addToCart(){
  if(!_curProd) return;
  _addToCart(_curProd, _curQty);
  closeProdModal();
}
function addToCartDirect(id){
  var p=getProds().find(function(x){return x.id===id;}); if(!p) return;
  _addToCart(p,1);
}
function _addToCart(prod, qty){
  var idx=_cart.findIndex(function(i){return i.prodId===prod.id;});
  if(idx>=0){ _cart[idx].qty+=qty; } else { _cart.push({prodId:prod.id,nombre:prod.nombre,precio:prod.precio,imagen:prod.imagen||'',qty:qty}); }
  saveCart(); renderCartCount();
  toast(prod.nombre+' agregado al carrito','success');
}

// ── Render carrito ──
function renderCart(){
  var body=document.getElementById('cart-body');
  var action=document.getElementById('cart-action');
  if(!_cart.length){
    body.innerHTML='<div class="empty-cart"><div class="ei">🛒</div><p>Tu carrito está vacío.<br><a href="#" onclick="showView(\'catalog\');return false">Ver productos</a></p></div>';
    if(action) action.style.display='none';
    return;
  }
  if(action) action.style.display='flex';
  var total=_cart.reduce(function(s,i){return s+(i.precio||0)*i.qty;},0);
  body.innerHTML='<div class="cart-panel">'+
    _cart.map(function(item,idx){
      return '<div class="cart-item">'+
        (item.imagen?'<img src="'+item.imagen+'" style="width:50px;height:50px;object-fit:cover;border-radius:7px">':'<div style="width:50px;height:50px;border-radius:7px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px">🛍️</div>')+
        '<div class="cart-item-name">'+escHtml(item.nombre||'')+'<br><span style="color:var(--gold);font-weight:700;font-size:13px">'+fmtCOP(item.precio||0)+' c/u</span></div>'+
        '<div class="cart-item-qty">'+
          '<button class="cart-item-qbtn" onclick="cartAdj('+idx+',-1)">−</button>'+
          '<span style="min-width:24px;text-align:center;font-weight:700">'+item.qty+'</span>'+
          '<button class="cart-item-qbtn" onclick="cartAdj('+idx+',1)">+</button>'+
        '</div>'+
        '<div style="font-weight:700;color:var(--gold);min-width:90px;text-align:right">'+fmtCOP((item.precio||0)*item.qty)+'</div>'+
        '<button onclick="cartRemove('+idx+')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;margin-left:6px">✕</button>'+
      '</div>';
    }).join('')+
    '<div class="cart-total-row"><span class="cart-total-lbl">Total</span><span class="cart-total-val">'+fmtCOP(total)+'</span></div>'+
  '</div>';
}
function cartAdj(idx,d){
  _cart[idx].qty=Math.max(1,_cart[idx].qty+d);
  saveCart(); renderCartCount(); renderCart();
}
function cartRemove(idx){
  _cart.splice(idx,1); saveCart(); renderCartCount(); renderCart();
}

// ── Checkout ──
function renderCheckout(){
  var total=_cart.reduce(function(s,i){return s+(i.precio||0)*i.qty;},0);
  document.getElementById('co-resumen').innerHTML=_cart.map(function(i){
    return '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>'+i.qty+'x '+escHtml(i.nombre||'')+'</span><span>'+fmtCOP((i.precio||0)*i.qty)+'</span></div>';
  }).join('');
  document.getElementById('co-total').textContent=fmtCOP(total);
}

function confirmarPedido(){
  var nombre=(document.getElementById('co-nombre').value||'').trim();
  var tel=(document.getElementById('co-tel').value||'').trim();
  var dir=(document.getElementById('co-dir').value||'').trim();
  if(!nombre){ toast('Ingresa tu nombre','error'); return; }
  if(!tel){ toast('Ingresa tu teléfono','error'); return; }
  if(!dir){ toast('Ingresa la dirección de entrega','error'); return; }
  if(!_cart.length){ toast('El carrito está vacío','error'); return; }
  var total=_cart.reduce(function(s,i){return s+(i.precio||0)*i.qty;},0);
  var pedido={
    id:uid(),
    items:_cart.map(function(i){ return {prodId:i.prodId,nombre:i.nombre,precio:i.precio,qty:i.qty}; }),
    total:total,
    estado:'NUEVO',
    cliente:{
      nombre:nombre, tel:tel,
      email:(document.getElementById('co-email').value||'').trim(),
      direccion:dir,
      nota:(document.getElementById('co-nota').value||'').trim()
    },
    createdAt:new Date().toISOString()
  };
  var all=getPedidos(); all.push(pedido); savePedidos(all);
  document.getElementById('success-id').textContent='ID de pedido: '+pedido.id.slice(-8).toUpperCase();
  showView('success');
  _cart=[]; saveCart(); renderCartCount();
}

// ── Helpers ──
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
