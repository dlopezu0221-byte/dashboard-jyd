const KEYS = Object.keys(BACKUP);

async function restaurar() {
  document.getElementById('btn-restaurar').style.display = 'none';
  const bar = document.getElementById('bar');
  const status = document.getElementById('status');
  const keyList = document.getElementById('key-list');
  keyList.style.display = 'block';

  let ok = 0, errors = 0;

  for (let i = 0; i < KEYS.length; i++) {
    const k = KEYS[i];
    const v = BACKUP[k];
    try {
      const existing = localStorage.getItem(k);
      if (existing !== null) {
        keyList.innerHTML += '<span class="key-ok">✓ ' + k + ' (actualizado)</span><br>';
      } else {
        keyList.innerHTML += '<span class="key-ok">✓ ' + k + ' (nuevo)</span><br>';
      }
      localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v));
      ok++;
    } catch(e) {
      keyList.innerHTML += '<span style="color:#f44336">✗ ' + k + ': ' + e.message + '</span><br>';
      errors++;
    }
    
    // scroll to bottom
    keyList.scrollTop = keyList.scrollHeight;
    
    bar.style.width = ((i+1) / KEYS.length * 100) + '%';
    status.textContent = 'Restaurando ' + (i+1) + ' de ' + KEYS.length + ': ' + k;
    
    // Small delay for visual feedback
    await new Promise(r => setTimeout(r, 30));
  }

  status.textContent = ok + ' claves restauradas exitosamente' + (errors > 0 ? ' (' + errors + ' errores)' : '') + ' ✅';
  bar.style.width = '100%';
  bar.style.background = errors > 0 ? '#ff9800' : '#4caf50';
  
  document.getElementById('btn-abrir').style.display = 'block';
  document.getElementById('warn').textContent = 
    'IMPORTANTE: Ahora abre jd_sistema_v86.html en el MISMO navegador y carpeta para ver todos los datos.';
}

function abrirSistema() {
  // Try to open the system file
  window.open('jd_sistema_v86.html', '_blank');
  document.getElementById('warn').textContent = 
    'Si no abrió automáticamente, abre manualmente el archivo jd_sistema_v86.html en este mismo navegador.';
}

// Auto-check if data already exists
window.onload = function() {
  const existing = localStorage.getItem('jd_liqs');
  if (existing) {
    const liqs = JSON.parse(existing);
    document.getElementById('status').textContent = 
      '⚠️ Ya hay datos en este navegador (' + liqs.length + ' liquidaciones). Restaurar sobreescribirá con el backup.';
    document.getElementById('warn').textContent = 
      'Puedes restaurar de todas formas para asegurar que los datos del backup estén completos.';
  }
};
